<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            max-width: 80%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f8f9fa;
            color: #333;
            border: 1px solid #e9ecef;
        }

        .message.error {
            align-self: flex-start;
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .loading {
            align-self: flex-start;
            color: #999;
            font-style: italic;
        }

        /* Markdown gerendered Styles */
        .message.assistant h1,
        .message.assistant h2,
        .message.assistant h3,
        .message.assistant h4,
        .message.assistant h5,
        .message.assistant h6 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .message.assistant h1:first-child,
        .message.assistant h2:first-child,
        .message.assistant h3:first-child {
            margin-top: 0;
        }

        .message.assistant h1 { font-size: 1.8em; }
        .message.assistant h2 { font-size: 1.5em; }
        .message.assistant h3 { font-size: 1.25em; }
        .message.assistant h4 { font-size: 1.1em; }

        .message.assistant p {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .message.assistant p:last-child {
            margin-bottom: 0;
        }

        .message.assistant ul,
        .message.assistant ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message.assistant li {
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .message.assistant code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
            color: #d63384;
        }

        .message.assistant pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message.assistant pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 0.85em;
        }

        .message.assistant blockquote {
            border-left: 4px solid #667eea;
            margin: 12px 0;
            padding: 8px 16px;
            background: #f1f3f5;
            color: #495057;
        }

        .message.assistant a {
            color: #667eea;
            text-decoration: none;
        }

        .message.assistant a:hover {
            text-decoration: underline;
        }

        .message.assistant table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .message.assistant th,
        .message.assistant td {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            text-align: left;
        }

        .message.assistant th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .message.assistant hr {
            border: none;
            border-top: 1px solid #dee2e6;
            margin: 16px 0;
        }

        .message.assistant strong {
            font-weight: 600;
            color: #2c3e50;
        }

        .message.assistant em {
            font-style: italic;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
    <!-- Marked.js für Markdown-Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat</h1>
        </div>
        <div class="chat-messages" id="messagesContainer"></div>
        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Schreib eine Nachricht..."
                autocomplete="off"
            >
            <button id="sendButton">Senden</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        // API URL - relative URL, keine CORS-Probleme
        const API_URL = '/api/chat';

        // Marked.js konfigurieren für sichere HTML-Ausgabe
        marked.setOptions({
            breaks: true,        // Zeilenumbrüche als <br>
            gfm: true,           // GitHub Flavored Markdown
            sanitize: false      // Wir vertrauen der Ausgabe (Ollama)
        });

        function addMessage(text, type = 'assistant') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            if (type === 'assistant') {
                // Markdown in HTML konvertieren
                messageDiv.innerHTML = marked.parse(text);
            } else {
                // Text für User und Fehler (sicher)
                messageDiv.textContent = text;
            }

            messagesContainer.appendChild(messageDiv);

            // Auto-scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message loading';
            messageDiv.id = 'loadingMessage';
            messageDiv.innerHTML = '<span>⏳ Denkt nach...</span>';
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();

            if (!message) return;

            // Nachricht des Benutzers anzeigen
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.focus();

            // Loading-Anzeige
            addLoadingMessage();
            sendButton.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                removeLoadingMessage();
                addMessage(data.answer, 'assistant');
            } catch (error) {
                removeLoadingMessage();
                addMessage(`Fehler: ${error.message}`, 'error');
                console.error('Error:', error);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus on load
        messageInput.focus();
    </script>
</body>
</html>
